services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-replace-me}
      JWT_EXPIRED: ${JWT_EXPIRED:-24h}
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  dashboard-data:
